name: Deploy to GitHub Pages

# Two modes, both driven by repository variables so no code change is needed
# to flip between them:
#
#   PREVIEW (now):  NEXT_PUBLIC_BASE_PATH = /msuea
#                   CUSTOM_DOMAIN         = (unset)
#                   -> https://nradachy-web.github.io/msuea/, noindex
#
#   PRODUCTION:     NEXT_PUBLIC_BASE_PATH = (unset or empty)
#                   CUSTOM_DOMAIN         = www.msuea.org
#                   -> served at the domain root, indexable

on:
  push:
    branches: [main]
  # Nightly rebuild, just after midnight in East Lansing (05:10 UTC is
  # 1:10 AM EDT or 12:10 AM EST), so the static HTML already lists the
  # right upcoming events. The pages also roll forward in the browser,
  # so nothing breaks if GitHub pauses this schedule.
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}

      - name: Write CNAME (production only)
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > out/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
